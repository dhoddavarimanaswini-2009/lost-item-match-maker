<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items | LostMatch</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #603cba;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #7048c8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5030a5;
        }

        #results {
            margin-top: 30px;
        }

        .result-card {
            background: #f2edff;
            border-left: 5px solid #7048c8;
            padding: 18px;
            margin: 15px 0;
            border-radius: 12px;
        }

        .result-card h3 {
            color: #603cba;
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .lost {
            background: #e05b67;
        }

        .found {
            background: #27ae75;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #603cba;
            text-decoration: none;
            font-weight: bold;
        }

        .no-results {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Search Items</h1>

    <p class="subtitle">
        Find your lost belongings or help someone find theirs!
    </p>

    <form id="searchForm">

        <label>Search by Item Name</label>
        <input type="text" id="searchName"
               placeholder="Enter item name">

        <label>Category</label>
        <select id="searchCategory">
            <option value="">All Categories</option>
            <option>Electronics</option>
            <option>Books and Notes</option>
            <option>ID Cards</option>
            <option>Clothing</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Report Type</label>
        <select id="itemType">
            <option value="">All Reports</option>
            <option value="lost">Lost Items</option>
            <option value="found">Found Items</option>
        </select>

        <button type="submit">Search Items</button>

    </form>

    <div id="results"></div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

const results = document.getElementById("results");

function displayItems(items) {

    results.innerHTML = "<h2>Search Results</h2>";

    if (items.length === 0) {

        results.innerHTML +=
            '<p class="no-results">No matching items found. Try another search!</p>';

        return;
    }

    items.forEach(item => {

        const card = document.createElement("div");
        card.className = "result-card";

        const heading = document.createElement("h3");
        heading.textContent = item.name;

        const badge = document.createElement("span");
        badge.className = "badge " + item.type;
        badge.textContent = item.type.toUpperCase();

        const description = document.createElement("p");
        description.textContent = "Description: " + item.description;

        const category = document.createElement("p");
        category.textContent = "Category: " + item.category;

        const location = document.createElement("p");
        location.textContent = "Location: " + item.location;

        const date = document.createElement("p");
        date.textContent = "Date: " + item.date;

        card.append(
            heading,
            badge,
            description,
            category,
            location,
            date
        );

        results.appendChild(card);

    });

}

// Display all saved reports when the page opens
function loadItems() {

    const reports =
        JSON.parse(localStorage.getItem("lostMatchReports")) || [];

    displayItems(reports);

}

// Search functionality
document.getElementById("searchForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("searchName")
        .value.trim().toLowerCase();

    const category = document.getElementById("searchCategory").value;

    const type = document.getElementById("itemType").value;

    const reports =
        JSON.parse(localStorage.getItem("lostMatchReports")) || [];

    const filtered = reports.filter(item => {

        return (
            item.name.toLowerCase().includes(name) &&
            (!category || item.category === category) &&
            (!type || item.type === type)
        );

    });

    displayItems(filtered);

});

loadItems();

</script>

</body>
</html>
