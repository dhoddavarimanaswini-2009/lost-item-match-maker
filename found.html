<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>🔍 Lost Item Matchmaker</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="lost.html">Report Lost</a>
            <a href="found.html">Report Found</a>
            <a href="matches.html">Search Items</a>
        </div>
    </nav>

    <div class="form-container">
        <h1>😊 Report a Found Item</h1>
        <p class="subtitle">Help someone find their missing belongings.</p>

        <form id="foundForm">

            <label>Item Name</label>
            <input type="text" id="itemName"
                   placeholder="e.g. Blue Water Bottle" required>

            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>Accessories</option>
                <option>Documents</option>
                <option>Clothing</option>
                <option>Others</option>
            </select>

            <label>Description</label>
            <textarea id="description"
                      placeholder="Describe the found item..."
                      required></textarea>

            <label>Location Found</label>
            <input type="text" id="location"
                   placeholder="Where did you find it?" required>

            <label>Date Found</label>
            <input type="date" id="date" required>

            <label>College Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your college email" required>

            <button type="submit" class="btn submit-btn">
                Submit Found Report
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        document.getElementById("foundForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const item = {
                id: Date.now(),
                name: document.getElementById("itemName").value.trim(),
                category: document.getElementById("category").value,
                description: document.getElementById("description").value.trim(),
                location: document.getElementById("location").value.trim(),
                date: document.getElementById("date").value,
                email: document.getElementById("email").value.trim(),
                type: "found"
            };

            let reports = JSON.parse(localStorage.getItem("lostMatchReports")) || [];

            reports.push(item);

            localStorage.setItem("lostMatchReports", JSON.stringify(reports));

            document.getElementById("message").textContent =
                "✅ Your found item report has been submitted successfully!";

            document.getElementById("foundForm").reset();
        });
    </script>

</body>
</html>
