<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>🔍 Lost Item Matchmaker</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="lost.html">Report Lost</a>
            <a href="found.html">Report Found</a>
            <a href="matches.html">Search Items</a>
        </div>
    </nav>

    <div class="search-container">

        <h1>🔎 Search for Items</h1>
        <p class="subtitle">Find lost or found items on campus.</p>

        <div class="search-box">

            <input type="text" id="searchName"
                   placeholder="Enter item name...">

            <select id="searchCategory">
                <option value="">All Categories</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>Accessories</option>
                <option>Documents</option>
                <option>Clothing</option>
                <option>Others</option>
            </select>

            <select id="searchType">
                <option value="">Lost and Found</option>
                <option value="lost">Lost Items</option>
                <option value="found">Found Items</option>
            </select>

            <button onclick="searchItems()" class="btn">
                Search
            </button>

            <button onclick="loadItems()" class="btn clear-btn">
                Show All
            </button>

        </div>

        <h2 class="results-heading">Reported Items</h2>

        <div id="results"></div>

        <a href="index.html" class="back-link">← Back to Home</a>

    </div>

    <script>

        function getReports() {
            return JSON.parse(localStorage.getItem("lostMatchReports")) || [];
        }

        function displayItems(items) {

            const results = document.getElementById("results");
            results.innerHTML = "";

            if (items.length === 0) {
                results.innerHTML =
                    "<p class='no-results'>No matching items found.</p>";
                return;
            }

            items.forEach(item => {

                const card = document.createElement("div");
                card.className = "item-card";

                const title = document.createElement("h3");
                title.textContent = item.name;

                const type = document.createElement("span");
                type.className = item.type === "lost" ? "lost-badge" : "found-badge";
                type.textContent = item.type.toUpperCase();

                const description = document.createElement("p");
                description.textContent = "Description: " + item.description;

                const category = document.createElement("p");
                category.textContent = "Category: " + item.category;

                const location = document.createElement("p");
                location.textContent = "Location: " + item.location;

                const date = document.createElement("p");
                date.textContent = "Date: " + item.date;

                card.appendChild(title);
                card.appendChild(type);
                card.appendChild(description);
                card.appendChild(category);
                card.appendChild(location);
                card.appendChild(date);

                if (item.email) {
                    const contact = document.createElement("a");

                    contact.href = "mailto:" + item.email;
                    contact.textContent = "Contact Reporter";
                    contact.className = "btn contact-btn";

                    card.appendChild(contact);
                }

                results.appendChild(card);

            });
        }

        function searchItems() {

            const name = document.getElementById("searchName").value
                .trim().toLowerCase();

            const category = document.getElementById("searchCategory").value;

            const type = document.getElementById("searchType").value;

            const reports = getReports();

            const filtered = reports.filter(item => {

                const matchesName = item.name.toLowerCase().includes(name);

                const matchesCategory =
                    category === "" || item.category === category;

                const matchesType =
                    type === "" || item.type === type;

                return matchesName && matchesCategory && matchesType;

            });

            displayItems(filtered);
        }

        function loadItems() {

            document.getElementById("searchName").value = "";
            document.getElementById("searchCategory").value = "";
            document.getElementById("searchType").value = "";

            displayItems(getReports());
        }

        loadItems();

    </script>

</body>
</html>
