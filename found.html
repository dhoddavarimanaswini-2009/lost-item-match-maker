<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item | LostMatch</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .form-container {
            max-width: 550px;
            margin: 30px auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        h1 {
            color: #603cba;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #7048c8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5030a5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #603cba;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Report a Found Item</h1>

    <p class="subtitle">
        Found something on campus? Help its owner get it back!
    </p>

    <form id="foundForm">

        <label>Item Name</label>
        <input type="text" id="itemName"
               placeholder="Example: Black Wallet" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>Books and Notes</option>
            <option>ID Cards</option>
            <option>Clothing</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <label>Description</label>
        <textarea id="description"
                  placeholder="Describe the item you found"
                  required></textarea>

        <label>Location Found</label>
        <input type="text" id="location"
               placeholder="Where did you find it?" required>

        <label>Date Found</label>
        <input type="date" id="date" required>

        <button type="submit">Submit Found Report</button>

    </form>

    <p id="message"></p>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

document.getElementById("foundForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const item = {
        id: Date.now(),
        name: document.getElementById("itemName").value.trim(),
        category: document.getElementById("category").value,
        description: document.getElementById("description").value.trim(),
        location: document.getElementById("location").value.trim(),
        date: document.getElementById("date").value,
        type: "found"
    };

    let reports = JSON.parse(localStorage.getItem("lostMatchReports")) || [];

    reports.push(item);

    localStorage.setItem("lostMatchReports", JSON.stringify(reports));

    document.getElementById("message").textContent =
        "Found item report submitted successfully!";

    this.reset();

});

</script>

</body>
</html>
