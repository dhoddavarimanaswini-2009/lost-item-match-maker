
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Report a Lost Item</h1>
    <p>Tell us about the item you have lost.</p>

    <form>
        <label>Item Name:</label><br>
        <input type="text" placeholder="Enter item name" required><br><br>

        <label>Description:</label><br>
        <textarea placeholder="Describe your lost item" required></textarea><br><br>

        <label>Location Lost:</label><br>
        <input type="text" placeholder="Where did you lose it?" required><br><br>

        <label>Date Lost:</label><br>
        <input type="date" required><br><br>

        <button type="submit">Submit Report</button>
    </form>

    <p><a href="index.html">Back to Home</a></p>

</body>
</html>
